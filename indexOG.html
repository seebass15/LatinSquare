 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Square Puzzle Game</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --cell-bg: #eef2f7;
            --cell-filled: #ffffff;
            --text-color: #2c3e50;
            --border-color: #cbd5e1;
            --accent-color: #2ec4b6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            color: var(--text-color);
        }

        /* GRID STYLING */
        .grid-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            aspect-ratio: 1;
            margin-bottom: 30px;
        }

        .cell {
            background-color: var(--cell-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .cell:hover {
            border-color: var(--primary-color);
            background-color: #e2e8f0;
        }

        .cell.filled {
            background-color: var(--cell-filled);
            cursor: default;
        }

        .cell.target-highlight {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.3);
        }

        /* CANDIDATE TRAY STYLING */
        .tray-label {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .candidates-tray {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .candidate-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            background-color: #ffffff;
            color: var(--primary-color);
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .candidate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .candidate-btn.selected {
            background-color: var(--primary-color);
            color: #ffffff;
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(74, 144, 226, 0.4);
        }

        .candidate-btn.empty-slot {
            border-color: #e2e8f0;
            background-color: #f8fafc;
            color: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* STATUS MESSAGE */
        .status-message {
            height: 24px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            color: #ef4444;
        }

        .status-message.success {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

        <div class="tray-label">Available Numbers</div>
        <div id="candidatesTray" class="candidates-tray"></div>

        <div id="statusMessage" class="status-message"></div>
    </div>
