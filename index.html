<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Square Puzzle Game</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --cell-bg: #eef2f7;
            --cell-filled: #ffffff;
            --text-color: #2c3e50;
            --border-color: #cbd5e1;
            --accent-color: #2ec4b6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 360px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 24px;
            color: var(--text-color);
        }

        /* SCORE BOARD STYLING */
        .score-board {
            font-size: 16px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        /* FIXED GRID SIZING (Prevents resizing bugs) */
        .grid-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            aspect-ratio: 1;
            margin-bottom: 25px;
        }

        .cell {
            background-color: var(--cell-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
        }

        .cell:hover {
            border-color: var(--primary-color);
            background-color: #e2e8f0;
        }

        .cell.filled {
            background-color: var(--cell-filled);
            cursor: default;
        }

        /* FULL-CELL ICE / FROST STYLING */
        .cell.hp-2 {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            border-color: #38bdf8;
            color: #0369a1;
            box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .cell.hp-3 {
            background: linear-gradient(135deg, #7dd3fc 0%, #0284c7 100%);
            border-color: #0284c7;
            color: #f0f9ff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.7), 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        /* CANDIDATE TRAY */
        .tray-label {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .candidates-tray {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .candidate-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            background-color: #ffffff;
            color: var(--primary-color);
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .candidate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .candidate-btn.selected {
            background-color: var(--primary-color);
            color: #ffffff;
            transform: scale(1.1);
        }

        .candidate-btn.empty-slot {
            border-color: #e2e8f0;
            background-color: #f8fafc;
            color: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .status-message {
            height: 24px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            color: #ef4444;
        }

        .status-message.success {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Latin Square</h1>
        <div class="score-board">Score: <span id="scoreVal">0</span></div>

        <div id="gridBoard" class="grid-board"></div>

        <div class="tray-label">Available Numbers</div>
        <div id="candidatesTray" class="candidates-tray"></div>

        <div id="statusMessage" class="status-message"></div>
    </div>

    <!-- GAME OVER MODAL -->
    <div id="gameOverModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-width: 300px; width: 90%;">
            <h2 style="margin-top: 0; color: #ef4444;">Game Over!</h2>
            <p style="color: #64748b; margin-bottom: 20px;">Your board is soft-locked. You ran out of valid moves!</p>
            <button onclick="restartGame()" style="background: #4a90e2; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;">Play Again</button>
        </div>
    </div>

    <script src="/latinsquare.js"></script>
    <script src="/rendering.js"></script>
</body>
</html>
